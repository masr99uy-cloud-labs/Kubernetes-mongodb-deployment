apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: mongo-app
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: mathiassilvauy99/my-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_ADMIN_USER
            - name: MONGO_DB_PWD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_ADMIN_PASS
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
